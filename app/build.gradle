plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.omnireality.ultra'
    compileSdk 35
    defaultConfig {
        applicationId "com.omnireality.ultra"
        minSdk 29
        targetSdk 34
        versionCode 9          // bump +1 every build so updates install in place
        versionName "12.2.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // debug-key-signed release: installable, no secrets needed
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'   // ComponentActivity + ActivityResult API
}
